<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <defs>
    <!-- Base paper grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- Fiber texture -->
    <filter id="fibers">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.4" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <!-- Subtle stains / age marks -->
    <filter id="stains">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <!-- Paper grain layer -->
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.04"/>
  <!-- Fiber layer — horizontal streaks -->
  <rect width="100%" height="100%" filter="url(#fibers)" opacity="0.018"/>
  <!-- Age stain layer — large soft blotches -->
  <rect width="100%" height="100%" filter="url(#stains)" opacity="0.025"/>
</svg>
